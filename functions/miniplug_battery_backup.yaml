#==============================================================================
# Mini Plug Function: Battery Backup (AC Disconnect)
#==============================================================================
# File: functions/miniplug_battery_backup.yaml
#
# Configures the plug as an AC power disconnect switch for battery backup
# systems. The relay controls AC input to a charger/inverter and defaults
# to ON so the system stays powered and charging under normal conditions.
#
# Designed for scenarios where Home Assistant automations manage the relay
# based on external conditions (e.g., lightning proximity, grid events)
# while the plug also monitors the battery via BMS addons.
#
# DEPENDENCIES:
#   - Hardware package providing:
#       - relay_output      : GPIO output for relay
#       - relay_led         : Internal light for relay status LED
#       - on_button_press   : Script called when button briefly pressed
#       - on_button_hold    : Script called when button held 3+ seconds
#   - BMS addon providing:
#       - ${exercise_bms_id}_state_of_charge : SOC sensor (%)
#       - ${exercise_bms_id}_charging        : BMS charging switch
#       - ${exercise_bms_id}_discharging     : BMS discharging switch
#   - Home Assistant entity: input_boolean.lightning_alert
#
# REQUIRED SUBSTITUTIONS:
#   - friendly_name : Human-readable device name
#
# OPTIONAL SUBSTITUTIONS:
#   - exercise_bms_id : BMS instance ID to use for exercise mode (default: "bms0")
#
# PROVIDES:
#   IDs:
#     - ac_disconnect              : Switch entity for the relay
#     - lightning_alert            : Binary sensor imported from HA
#     - battery_exercise_mode      : Switch to enable/disable LiFePO4 exercise cycling
#     - exercise_high_soc          : Number — SOC % at which charging is stopped
#     - exercise_low_soc           : Number — SOC % at which charging resumes
#     - exercise_low_discharge_soc : Number — SOC % at which discharging is stopped
#                                    (software floor above BMS hard cutoff)
#
# ENTITIES EXPOSED TO HOME ASSISTANT:
#   Switches:
#     - AC Power                   : Main relay control (on = AC connected)
#     - Battery Exercise Mode      : Enables automatic charge cycling for LiFePO4 health
#   Binary Sensors:
#     - Lightning Alert            : Imported from HA (device_class: safety)
#   Numbers (config category):
#     - Battery Exercise High SOC        : Charging stops here       (default 90%)
#     - Battery Exercise Low SOC         : Charging resumes here     (default 20%)
#     - Battery Exercise Discharge Floor : Discharging stops here    (default 12%)
#                                          Discharging re-enables at exercise_low_soc
#
# BEHAVIOR:
#   - Relay defaults ON at boot (AC power flowing to charger/inverter)
#   - Short button press toggles relay
#   - Long button press reserved for future use (no-op currently)
#   - Relay LED syncs with relay state (white LED on = AC connected)
#   - Lightning alert drives relay automatically (no HA automation required):
#       lightning_alert ON  → relay turns OFF (isolate from grid)
#       lightning_alert OFF → relay turns ON  (reconnect to grid)
#       Fires on every state update from HA (on_state) so reconnects and reboots
#       are handled immediately without a polling interval
#   - When Battery Exercise Mode is ON (checked every 30 seconds):
#       Charge side:
#         - BMS charging disabled once SOC >= High SOC threshold
#         - BMS charging re-enabled once SOC <= Low SOC threshold
#       Discharge floor:
#         - BMS discharging disabled once SOC <= Discharge Floor threshold
#           (prevents reaching BMS hard cutoff which can damage LiFePO4 cells)
#         - BMS discharging re-enabled once SOC recovers to >= Low SOC threshold
#       All thresholds adjustable from HA and persist across reboots
#
# USAGE:
#   substitutions:
#     device_name: "lightning-switch-tower"
#     friendly_name: "Lightning Switch Tower"
#     device_description: "Lightning Tower UPS - SwitchBot Mini Plug + JBD BMS"
#     exercise_bms_id: "bms0"   # optional, bms0 is the default
#
#   packages:
#     base: !include common/esp_common.yaml
#     hardware: !include hardware/switchbot_miniplug_W1901400.yaml
#     function: !include functions/miniplug_battery_backup.yaml
#     bms0: !include
#       file: addons/jbd_bms_ble.yaml
#       vars:
#         bms_id: "bms0"
#         bms_name: "Battery"
#         bms_mac_address: "A5:C2:37:37:D0:16"
#     battery0: !include
#       file: addons/battery_power_analysis.yaml
#       vars:
#         bms_id: "bms0"
#         bms_name: "Battery"
#         max_battery_current: "100"
#         inverter_efficiency: "0.85"
#==============================================================================

# Default BMS instance for exercise mode — override at device level if needed
substitutions:
  exercise_bms_id: "bms0"

#------------------------------------------------------------------------------
# AC Disconnect Switch (Relay)
#------------------------------------------------------------------------------
switch:
  - platform: output
    name: "AC Power"
    id: ac_disconnect
    output: relay_output
    device_class: outlet
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - light.turn_on: relay_led
    on_turn_off:
      - light.turn_off: relay_led

  #----------------------------------------------------------------------------
  # Battery Exercise Mode
  # When enabled, manages the BMS charging and discharging switches to cycle
  # the battery between configurable SOC thresholds rather than holding it at
  # full charge. Intended for long-term LiFePO4 health in always-connected
  # backup systems.
  #----------------------------------------------------------------------------
  - platform: template
    name: "Battery Exercise Mode"
    id: battery_exercise_mode
    icon: mdi:battery-sync
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

#------------------------------------------------------------------------------
# Lightning Alert (Home Stance Dashboard)
# Imported from Home Assistant input_boolean.lightning_alert.
# on_state fires on every HA state update — handles boot, reconnects, and
# live changes without needing a polling interval.
#------------------------------------------------------------------------------
binary_sensor:
  - platform: homeassistant
    id: lightning_alert
    entity_id: input_boolean.lightning_alert
    name: "Lightning Alert"
    device_class: safety
    on_state:
      - if:
          condition:
            binary_sensor.is_on: lightning_alert
          then:
            - logger.log: "Lightning Alert ACTIVATED - disconnecting AC power"
            - switch.turn_off: ac_disconnect
          else:
            - logger.log: "Lightning Alert CLEARED - reconnecting AC power"
            - switch.turn_on: ac_disconnect

#------------------------------------------------------------------------------
# Exercise Mode Threshold Controls
#------------------------------------------------------------------------------
number:
  - platform: template
    name: "Battery Exercise High SOC"
    id: exercise_high_soc
    min_value: 50
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-up
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 90

  - platform: template
    name: "Battery Exercise Low SOC"
    id: exercise_low_soc
    min_value: 5
    max_value: 80
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-arrow-down
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 20

  - platform: template
    name: "Battery Exercise Discharge Floor"
    id: exercise_low_discharge_soc
    min_value: 5
    max_value: 25
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-alert
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 12

#------------------------------------------------------------------------------
# Exercise Mode Automation
# Runs every 30s. When exercise mode is active:
#   Charge side  — stops charging at high threshold, resumes at low threshold
#   Discharge floor — stops discharging at floor to avoid BMS hard cutoff;
#                     re-enables once SOC recovers to the low SOC threshold
#------------------------------------------------------------------------------
interval:
  - interval: 30s
    then:
      - lambda: |-
          if (!id(battery_exercise_mode).state) return;
          float soc = id(${exercise_bms_id}_state_of_charge).state;
          if (isnan(soc)) return;

          // Charge side
          if (soc >= id(exercise_high_soc).state) {
            id(${exercise_bms_id}_charging).turn_off();
          } else if (soc <= id(exercise_low_soc).state) {
            id(${exercise_bms_id}_charging).turn_on();
          }

          // Discharge floor — prevents reaching BMS hard cutoff
          // Re-enables once SOC recovers to the charge-resume threshold
          if (soc <= id(exercise_low_discharge_soc).state) {
            id(${exercise_bms_id}_discharging).turn_off();
          } else if (soc >= id(exercise_low_soc).state) {
            id(${exercise_bms_id}_discharging).turn_on();
          }

#------------------------------------------------------------------------------
# Button Behavior
# Short press : toggle AC power (manual override)
# Hold 3s     : reserved for future use
#------------------------------------------------------------------------------
script:
  - id: on_button_press
    then:
      - switch.toggle: ac_disconnect

  - id: on_button_hold
    then:
      - logger.log:
          level: INFO
          format: "Long press - no action assigned"
