#==============================================================================
# Mini Plug Function: Lamp
#==============================================================================
# File: functions/miniplug_lamp.yaml
#
# Configures the plug as a lamp controller. Exposes relay as a light entity,
# relay LED follows relay state, button toggles light.
#
# DEPENDENCIES:
#   - Hardware package providing:
#       - relay_output      : GPIO output for relay
#       - relay_led         : Internal light for relay status LED
#       - on_button_press   : Script called when button pressed
#
# REQUIRED SUBSTITUTIONS:
#   - friendly_name : Human-readable device name
#
# PROVIDES:
#   IDs:
#     - lamp : Light entity for the relay
#
# ENTITIES EXPOSED TO HOME ASSISTANT:
#   Lights:
#     - Lamp : Main lamp control (on/off)
#
# USAGE:
#   substitutions:
#     device_name: "living-room-lamp"
#     friendly_name: "Living Room Lamp"
#
#   packages:
#     base: !include common/esp_common.yaml
#     hardware: !include hardware/switchbot_miniplug_W1901400.yaml
#     function: !include functions/miniplug_lamp.yaml
#==============================================================================

#------------------------------------------------------------------------------
# Light Entity (Relay)
#------------------------------------------------------------------------------
light:
  # Main lamp - exposed to Home Assistant
  - platform: binary
    name: "Lamp"
    id: lamp
    output: relay_output
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - light.turn_on: relay_led
    on_turn_off:
      - light.turn_off: relay_led

#------------------------------------------------------------------------------
# Button Behavior - Override hardware script to toggle lamp
#------------------------------------------------------------------------------
script:
  - id: on_button_press
    then:
      - light.toggle: lamp

  - id: on_button_hold
    then:
      - logger.log: "Long press (no action defined for lamp function)"