#==============================================================================
# Electechsup R4D1C32 - Tester / Function Package
#==============================================================================
# File: functions/r4d1c32_relay.yaml
#
# Tester for an Electechsup R4D1C32 (4-channel Modbus RTU relay board) sitting
# behind an HW-519 RS485 adapter. Exposes each relay as a switch, plus a few
# helpers (all-on/all-off, sequential walk, comms-status sensor) so you can
# confirm wiring and Modbus framing before building real automations.
#
# SLAVE ADDRESS - set on the board's DIP switches A0..A5 (6 bits, binary):
#     A0 = bit 0 (value 1)         A3 = bit 3 (value 8)
#     A1 = bit 1 (value 2)         A4 = bit 4 (value 16)
#     A2 = bit 2 (value 4)         A5 = bit 5 (value 32)
#   Examples: address 1 -> A0 ON, all others OFF.
#             address 5 -> A0 + A2 ON.
#             address 63 -> all six ON.
#   Whatever you set on the DIPs, mirror it in r4d1c32_address below.
#
# WHAT'S ASSUMED (defaults; override via substitutions if your board differs):
#   - Slave address     : 1     (DIP A0 ON, A1..A5 OFF)
#   - Baud / framing    : 9600 8N1  (matches addon/modbus_rtu.yaml default)
#   - Relay register    : coil 0x0000..0x0003 (FC05 write, FC01 read)
#   These match the most common Electechsup 4-relay default profile. If the
#   relays don't respond, check DIP switches, baud, and verify A/B aren't
#   swapped on the RS485 side.
#
# DEPENDENCIES:
#   - addon/modbus_rtu.yaml (provides ${modbus_id})
#
# SUBSTITUTIONS:
#   r4d1c32_id              : modbus_controller id (default: r4d1c32)
#   r4d1c32_name            : friendly name prefix (default: "R4D1C32")
#   r4d1c32_address         : Modbus slave address - MUST match DIP switches
#                             (default: 1)
#   r4d1c32_update_interval : poll interval for relay state (default: 2s)
#
# PROVIDES (HA entities):
#   - 4 x switch  : ${r4d1c32_name} Relay 1..4
#   - 3 x button  : All On, All Off, Sequential Walk
#   - 1 x binary_sensor : Modbus Online (diagnostic)
#
# USAGE:
#   packages:
#     hardware:  !include esphome-framework/hardware/esp32_devkit_v1.yaml
#     base:      !include esphome-framework/common/connectivity.yaml
#     modbus:    !include esphome-framework/addon/modbus_rtu.yaml
#     r4d1c32:   !include esphome-framework/functions/r4d1c32_relay.yaml
#==============================================================================

substitutions:
  r4d1c32_id: r4d1c32
  r4d1c32_name: "R4D1C32"
  r4d1c32_address: "1"
  r4d1c32_update_interval: 2s

modbus_controller:
  - id: ${r4d1c32_id}
    modbus_id: ${modbus_id}
    address: ${r4d1c32_address}
    setup_priority: -10
    update_interval: ${r4d1c32_update_interval}
    command_throttle: 100ms
    on_online:
      then:
        - binary_sensor.template.publish:
            id: ${r4d1c32_id}_online
            state: true
    on_offline:
      then:
        - binary_sensor.template.publish:
            id: ${r4d1c32_id}_online
            state: false

#------------------------------------------------------------------------------
# Relays - exposed as Modbus coil switches.
# Electechsup boards typically expose each relay at one coil address; FC05
# (write single coil) toggles, FC01 (read coils) returns state.
#------------------------------------------------------------------------------
switch:
  - platform: modbus_controller
    modbus_controller_id: ${r4d1c32_id}
    id: ${r4d1c32_id}_relay_1
    name: "${r4d1c32_name} Relay 1"
    register_type: coil
    address: 0
    icon: "mdi:electric-switch"

  - platform: modbus_controller
    modbus_controller_id: ${r4d1c32_id}
    id: ${r4d1c32_id}_relay_2
    name: "${r4d1c32_name} Relay 2"
    register_type: coil
    address: 1
    icon: "mdi:electric-switch"

  - platform: modbus_controller
    modbus_controller_id: ${r4d1c32_id}
    id: ${r4d1c32_id}_relay_3
    name: "${r4d1c32_name} Relay 3"
    register_type: coil
    address: 2
    icon: "mdi:electric-switch"

  - platform: modbus_controller
    modbus_controller_id: ${r4d1c32_id}
    id: ${r4d1c32_id}_relay_4
    name: "${r4d1c32_name} Relay 4"
    register_type: coil
    address: 3
    icon: "mdi:electric-switch"

#------------------------------------------------------------------------------
# Test helpers
#------------------------------------------------------------------------------
button:
  - platform: template
    name: "${r4d1c32_name} All On"
    icon: "mdi:flash"
    on_press:
      - switch.turn_on: ${r4d1c32_id}_relay_1
      - switch.turn_on: ${r4d1c32_id}_relay_2
      - switch.turn_on: ${r4d1c32_id}_relay_3
      - switch.turn_on: ${r4d1c32_id}_relay_4

  - platform: template
    name: "${r4d1c32_name} All Off"
    icon: "mdi:flash-off"
    on_press:
      - switch.turn_off: ${r4d1c32_id}_relay_1
      - switch.turn_off: ${r4d1c32_id}_relay_2
      - switch.turn_off: ${r4d1c32_id}_relay_3
      - switch.turn_off: ${r4d1c32_id}_relay_4

  - platform: template
    name: "${r4d1c32_name} Sequential Walk"
    icon: "mdi:walk"
    on_press:
      - script.execute: ${r4d1c32_id}_walk

script:
  - id: ${r4d1c32_id}_walk
    mode: restart
    then:
      - switch.turn_off: ${r4d1c32_id}_relay_1
      - switch.turn_off: ${r4d1c32_id}_relay_2
      - switch.turn_off: ${r4d1c32_id}_relay_3
      - switch.turn_off: ${r4d1c32_id}_relay_4
      - delay: 300ms
      - switch.turn_on: ${r4d1c32_id}_relay_1
      - delay: 500ms
      - switch.turn_off: ${r4d1c32_id}_relay_1
      - switch.turn_on: ${r4d1c32_id}_relay_2
      - delay: 500ms
      - switch.turn_off: ${r4d1c32_id}_relay_2
      - switch.turn_on: ${r4d1c32_id}_relay_3
      - delay: 500ms
      - switch.turn_off: ${r4d1c32_id}_relay_3
      - switch.turn_on: ${r4d1c32_id}_relay_4
      - delay: 500ms
      - switch.turn_off: ${r4d1c32_id}_relay_4

#------------------------------------------------------------------------------
# Diagnostic: is the slave actually answering?
# Driven by modbus_controller's on_online/on_offline triggers below.
#------------------------------------------------------------------------------
binary_sensor:
  - platform: template
    id: ${r4d1c32_id}_online
    name: "${r4d1c32_name} Modbus Online"
    device_class: connectivity
    entity_category: diagnostic
