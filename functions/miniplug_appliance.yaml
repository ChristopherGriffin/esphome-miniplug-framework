#==============================================================================
# Mini Plug Function: Appliance Monitor
#==============================================================================
# File: functions/miniplug_appliance.yaml
#
# Monitors appliance power consumption across four levels driven by three
# configurable thresholds. The meaning of each level is entirely user-defined
# via the transition messages — the same file works for a coffee maker, a
# dishwasher, a space heater, etc. just by setting different messages and
# threshold values.
#
# HOW LEVELS WORK:
#   Level 1 : power < Level 2 Min             (typically: off / idle / unplugged)
#   Level 2 : Level 2 Min <= power < Level 3 Min
#   Level 3 : Level 3 Min <= power < Level 4 Min
#   Level 4 : power >= Level 4 Min            (typically: full load / overcurrent)
#
#   Each threshold is the MINIMUM wattage required to ENTER that level.
#   e.g. "Level 3 Min = 100W" means the appliance must draw at least 100W
#   before the state changes to Level 3.
#
# HOW DEBOUNCE WORKS (Confirm Time):
#   A level change is only confirmed after the new level has been stable for
#   Confirm Time seconds. This prevents false transitions from brief mid-cycle
#   power dips (e.g. a dishwasher dropping to 0W between wash stages).
#   Debounce only applies when leaving an elevated state — transitions FROM
#   Level 1 upward always fire immediately so start events are never delayed.
#   Resolution is 2s (the polling interval). Set to 0 for immediate transitions.
#
# HOW MESSAGES WORK:
#   Each level has one configurable message (set via web UI or HA).
#   When a confirmed level transition occurs, the message for the new level
#   is published to the Notification sensor. Leave blank to silence that level.
#   Downstream HA automations should trigger on the Notification sensor — it
#   only fires on real confirmed transitions, not every poll cycle.
#
# MESSAGE STORAGE:
#   Messages are stored in flash-backed globals so they survive power cuts.
#   Each is capped at 24 characters (max_restore_data_length) — unconstrained
#   strings caused flash corruption and lost messages on reboot in testing.
#
# DEPENDENCIES (provided by hardware package):
#   - relay_output    : GPIO output driving the relay
#   - on_button_press : Script called on short button press
#   - on_button_hold  : Script called on long button press (3s+)
#   - power           : Power sensor in watts (W)
#
# PROVIDES (consumed by HA automations and dashboards):
#   - appliance           : Switch — controls the relay
#   - appliance_state     : Text sensor — current level ("Level 1" … "Level 4")
#   - notification_message: Text sensor — fires on each confirmed transition
#   - level_2_min         : Number — min W to reach Level 2 (default 5W)
#   - level_3_min         : Number — min W to reach Level 3 (default 50W)
#   - level_4_min         : Number — min W to reach Level 4 (default 1000W)
#   - confirm_time        : Number — debounce window in seconds (default 0)
#   - button_enabled      : Select — enable/disable physical button toggle
#
# USAGE:
#   substitutions:
#     device_name: "coffee-maker"
#     friendly_name: "Coffee Maker"
#     name_no_dashes: "coffee_maker"
#
#   packages:
#     base: !include common/esp_common.yaml
#     hardware: !include hardware/sonoff_s31.yaml
#     function: !include functions/miniplug_appliance.yaml
#==============================================================================

esp8266:
  restore_from_flash: true  # enables flash-backed globals; without this, message strings exceed the 512B RTC limit and are lost on power cut


#------------------------------------------------------------------------------
# Globals
#------------------------------------------------------------------------------
globals:
  # Tracks the last confirmed level — used to detect transitions and suppress
  # duplicate notifications. Not restored on boot so startup always re-evaluates.
  - id: prev_appliance_state
    type: std::string
    restore_value: no
    initial_value: '""'

  # Holds the level currently being evaluated for debounce confirmation.
  # Resets whenever power returns to the confirmed level mid-wait.
  - id: g_pending_state
    type: std::string
    restore_value: no
    initial_value: '""'

  # Counts how many 2s polling cycles the pending state has been stable.
  # When ticks * 2s >= confirm_time, the transition is committed.
  - id: g_pending_ticks
    type: int
    restore_value: no
    initial_value: '0'

  # Holds the last notification that was published. Flash-backed so the value
  # survives a power cut and is republished to the sensor on the next boot.
  # Note: because the sensor republishes on boot (update_interval: 6h), any HA
  # automation triggered by Notification will also fire on reboot.
  - id: g_last_notification
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'

  # Flash-backed message strings — one per level. Capped at 24 chars to prevent
  # flash corruption; unconstrained strings caused lost messages on reboot.
  - id: g_msg_to_l1
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  - id: g_msg_to_l2
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  - id: g_msg_to_l3
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'
  - id: g_msg_to_l4
    type: std::string
    restore_value: true
    max_restore_data_length: 24
    initial_value: '""'


#------------------------------------------------------------------------------
# Relay Switch
#------------------------------------------------------------------------------
switch:
  - platform: output
    name: "Appliance"
    id: appliance
    output: relay_output  # relay_output is defined in the hardware package
    icon: mdi:power-socket-us
    restore_mode: ALWAYS_ON  # relay returns to ON after a power cut — change if the appliance should stay off


#------------------------------------------------------------------------------
# Selects
#------------------------------------------------------------------------------
select:
  # Allows the physical button to be disabled — useful when the plug is in an
  # awkward location or the appliance should not be manually switched off.
  - platform: template
    name: "Button"
    id: button_enabled
    icon: mdi:gesture-tap-button
    options:
      - "Enabled"
      - "Disabled"
    initial_option: "Enabled"
    optimistic: true
    restore_value: true
    entity_category: config


#------------------------------------------------------------------------------
# Level Threshold Configuration
# Named "Level X Min" so the direction is unambiguous in the web UI:
# "Level 3 Min = 100W" means you need at least 100W to be IN Level 3.
# Alphabetical sort in the web UI works in our favour: Level 2/3/4 Min stack
# in the correct order.
#------------------------------------------------------------------------------
number:
  - platform: template
    name: "Level 2 Min"
    id: level_2_min
    icon: mdi:flash-outline
    unit_of_measurement: W
    entity_category: config
    mode: box
    min_value: 0
    max_value: 3000
    step: 0.5
    initial_value: 5
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_appliance_state  # re-evaluate immediately when threshold changes

  - platform: template
    name: "Level 3 Min"
    id: level_3_min
    icon: mdi:flash
    unit_of_measurement: W
    entity_category: config
    mode: box
    min_value: 0
    max_value: 3000
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_appliance_state

  - platform: template
    name: "Level 4 Min"
    id: level_4_min
    icon: mdi:flash-alert
    unit_of_measurement: W
    entity_category: config
    mode: box
    min_value: 0
    max_value: 3000
    step: 1
    initial_value: 1000
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_appliance_state

  # How long (seconds) the new level must hold before the transition is committed.
  # Uses the 2s poll as its clock — 900s = 450 ticks = 15 minutes.
  # Only applies when leaving an elevated level; transitions from Level 1 are always immediate.
  - platform: template
    name: "Confirm Time"
    id: confirm_time
    icon: mdi:timer-check-outline
    unit_of_measurement: s
    entity_category: config
    mode: box
    min_value: 0
    max_value: 3600  # 1 hour max — dishwasher mid-cycle dips can need up to 15 min (900s)
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true


#------------------------------------------------------------------------------
# Transition Message Configuration
# Set a message for each level in the web UI or HA. Leave blank to silence
# that transition. Messages are stored in flash globals (not in the sensor
# itself) so they survive reboots independently of the display.
#------------------------------------------------------------------------------
text:
  # update_interval: 6h — lambda runs on boot to push the flash-restored global
  # value back into the display sensor. "never" skips boot evaluation entirely,
  # leaving the web UI and HA showing blank even though the stored value is intact.
  - platform: template
    name: "Msg: To Level 1"
    id: msg_to_l1
    icon: mdi:message-off-outline
    mode: text
    entity_category: config
    update_interval: 6h  # republishes flash-restored global to display on boot; "never" skips boot eval leaving UI blank
    lambda: 'return id(g_msg_to_l1);'
    set_action:
      - lambda: |-
          id(g_msg_to_l1) = x;           // write to the flash-backed global (persists across reboots)
          id(msg_to_l1).publish_state(x); // update the display immediately without waiting for the 6h poll

  - platform: template
    name: "Msg: To Level 2"
    id: msg_to_l2
    icon: mdi:message-outline
    mode: text
    entity_category: config
    update_interval: 6h  # republishes flash-restored global to display on boot; "never" skips boot eval leaving UI blank
    lambda: 'return id(g_msg_to_l2);'
    set_action:
      - lambda: |-
          id(g_msg_to_l2) = x;
          id(msg_to_l2).publish_state(x);

  - platform: template
    name: "Msg: To Level 3"
    id: msg_to_l3
    icon: mdi:message-arrow-right-outline
    mode: text
    entity_category: config
    update_interval: 6h  # republishes flash-restored global to display on boot; "never" skips boot eval leaving UI blank
    lambda: 'return id(g_msg_to_l3);'
    set_action:
      - lambda: |-
          id(g_msg_to_l3) = x;
          id(msg_to_l3).publish_state(x);

  - platform: template
    name: "Msg: To Level 4"
    id: msg_to_l4
    icon: mdi:message-alert-outline
    mode: text
    entity_category: config
    update_interval: 6h  # republishes flash-restored global to display on boot; "never" skips boot eval leaving UI blank
    lambda: 'return id(g_msg_to_l4);'
    set_action:
      - lambda: |-
          id(g_msg_to_l4) = x;
          id(msg_to_l4).publish_state(x);


#------------------------------------------------------------------------------
# Text Sensors
#------------------------------------------------------------------------------
text_sensor:
  # Current confirmed level — safe to use in HA dashboards and conditions.
  # Does NOT update during a pending debounce window; holds the last stable level.
  - platform: template
    name: "State"
    id: appliance_state
    icon: mdi:state-machine

  # Fires only on confirmed level transitions. Wire HA automations to this —
  # it carries the message text so the automation doesn't need to look it up.
  # Blank messages are suppressed; the sensor only publishes when there is something to say.
  # update_interval: 6h republishes the flash-restored global on boot so the last
  # message is visible in the web UI and HA after a reset.
  - platform: template
    name: "Notification"
    id: notification_message
    icon: mdi:message-text
    update_interval: 6h
    lambda: 'return id(g_last_notification);'


#------------------------------------------------------------------------------
# Scripts
#------------------------------------------------------------------------------
script:
  - id: update_appliance_state
    then:
      - lambda: |-
          float pwr = id(power).state;
          if (isnan(pwr)) {
            // Power sensor not yet ready (e.g. immediately after boot) — skip this cycle
            id(appliance_state).publish_state("Unknown");
            return;
          }

          // Classify current wattage into a level based on the three thresholds
          std::string raw_state;
          if (pwr >= id(level_4_min).state) {
            raw_state = "Level 4";
          } else if (pwr >= id(level_3_min).state) {
            raw_state = "Level 3";
          } else if (pwr >= id(level_2_min).state) {
            raw_state = "Level 2";
          } else {
            raw_state = "Level 1";
          }

          std::string confirmed = id(prev_appliance_state);

          // First run after boot — set initial state immediately with no message,
          // since there is no previous state to transition from
          if (confirmed.empty()) {
            id(prev_appliance_state) = raw_state;
            id(appliance_state).publish_state(raw_state);
            return;
          }

          // No change — clear any pending debounce and exit
          if (raw_state == confirmed) {
            id(g_pending_state) = "";
            id(g_pending_ticks) = 0;
            return;
          }

          // Leaving Level 1 always fires immediately — debounce is only needed
          // when already running, to filter mid-cycle dips back down
          if (confirmed == "Level 1") {
            id(prev_appliance_state) = raw_state;
            id(appliance_state).publish_state(raw_state);
            id(g_pending_state) = "";
            id(g_pending_ticks) = 0;
            std::string msg = "";
            if (raw_state == "Level 2") msg = id(g_msg_to_l2);
            else if (raw_state == "Level 3") msg = id(g_msg_to_l3);
            else if (raw_state == "Level 4") msg = id(g_msg_to_l4);
            if (!msg.empty()) {
              id(g_last_notification) = msg;  // persist to flash so the value survives a reset
              id(notification_message).publish_state(msg);
            }
            return;
          }

          // Still at an elevated level — accumulate ticks for the new candidate state.
          // If the raw reading keeps changing, ticks reset and the clock starts over.
          if (raw_state != id(g_pending_state)) {
            id(g_pending_state) = raw_state;
            id(g_pending_ticks) = 1;
          } else {
            id(g_pending_ticks) += 1;
          }

          // Check whether the candidate has been stable long enough to commit.
          // ceilf ensures partial seconds round up — e.g. 5s confirm = 3 ticks (6s actual).
          int ticks_needed = (int)ceilf(id(confirm_time).state / 2.0f);
          if (ticks_needed < 1) ticks_needed = 1;  // always require at least one clean reading
          if (id(g_pending_ticks) < ticks_needed) return;  // not stable long enough yet — wait

          // Transition confirmed — commit and fire the message for the new level
          std::string new_state = id(g_pending_state);
          id(prev_appliance_state) = new_state;
          id(appliance_state).publish_state(new_state);
          id(g_pending_state) = "";
          id(g_pending_ticks) = 0;

          std::string msg = "";
          if (new_state == "Level 1") msg = id(g_msg_to_l1);
          else if (new_state == "Level 2") msg = id(g_msg_to_l2);
          else if (new_state == "Level 3") msg = id(g_msg_to_l3);
          else if (new_state == "Level 4") msg = id(g_msg_to_l4);

          if (!msg.empty()) {
            id(g_last_notification) = msg;  // persist to flash so the value survives a reset
            id(notification_message).publish_state(msg);  // blank messages are silenced — nothing sent
          }

  # Called by the hardware button handler — toggle the relay if button is enabled
  - id: on_button_press
    then:
      - if:
          condition:
            lambda: 'return id(button_enabled).current_option() == "Enabled";'
          then:
            - switch.toggle: appliance

  # Long press hook — no action defined for appliance monitoring use case
  - id: on_button_hold
    then:
      - logger.log: "Long press (no action defined for appliance function)"


#------------------------------------------------------------------------------
# Power Change Handler
# Runs every 2 seconds — this interval is the clock for the debounce system.
# Increasing it reduces CPU load but coarsens the confirm_time resolution.
#------------------------------------------------------------------------------
interval:
  - interval: 2s
    then:
      - script.execute: update_appliance_state
