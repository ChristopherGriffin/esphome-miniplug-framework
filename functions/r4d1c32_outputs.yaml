  #----------------------------------------------------------------------------
  # Bulk control - internal switch targeting register 0 (broadcast). Polling
  # is disabled with assumed_state because register 0 isn't a real channel.
  # Two buttons below flip this internal switch to fire All On / All Off.
  #----------------------------------------------------------------------------
  - platform: modbus_controller
    modbus_controller_id: ${r4d1c32_id}
    id: ${r4d1c32_id}_bulk
    internal: true
    register_type: holding
    address: 0
    assumed_state: true
    use_write_multiple: false
    write_lambda: |-
      payload.push_back(${r4d1c32_address});
      payload.push_back(0x06);
      payload.push_back(0x00);
      payload.push_back(0x00);                // register 0 (broadcast)
      payload.push_back(x ? 0x07 : 0x08);     // 0x07 = All Open, 0x08 = All Close
      payload.push_back(0x00);
      return x ? true : false;

#==============================================================================
# Buttons - dispatch to the internal bulk switch.
#==============================================================================
button:
  - platform: template
    name: "${r4d1c32_name} All On"
    icon: "mdi:flash"
    on_press:
      - switch.turn_on: ${r4d1c32_id}_bulk

  - platform: template
    name: "${r4d1c32_name} All Off"
    icon: "mdi:flash-off"
    on_press:
      - switch.turn_off: ${r4d1c32_id}_bulk
