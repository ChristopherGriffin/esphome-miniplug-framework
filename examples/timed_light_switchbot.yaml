#==============================================================================
# Example: Timed Light with Scheduling on SwitchBot Mini Plug
#==============================================================================
# Scheduled light with sunrise/sunset awareness. Configure the schedule
# entirely from Home Assistant - no reflashing needed to change times.
#
# SCHEDULE EXAMPLES (configured in HA after flashing):
#   - On at sunrise, off 12 hours later (default)
#   - On at sunrise, off at sunset
#   - On at 6am, off at 10pm
#   - On 1 hour before sunrise, off 2 hours after sunset
#
# REQUIRED SUBSTITUTIONS:
#   - latitude/longitude: Your location for sun calculations
#     (use negative values for western longitude and southern latitude)
#==============================================================================

substitutions:
  device_name: "porch-light"
  device_description: "Front porch light on sunset schedule"
  friendly_name: "Porch Light"
  latitude: "33.4484"      # <-- Change to your latitude
  longitude: "-112.0740"   # <-- Change to your longitude

packages:
  base: !include ../common/esp_common.yaml
  hardware: !include ../hardware/switchbot_miniplug_W1901400.yaml
  function: !include ../functions/miniplug_timed_light.yaml
