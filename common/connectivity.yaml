#==============================================================================
# Connectivity Package
#==============================================================================
# File: common/connectivity.yaml
#
# Network stack only — wifi (STA), api, ota, web_server, mdns, time, and the
# core esphome name/comment/friendly_name block. Designed to be safely combined
# with third-party packages (e.g. esphome-econet) that may bring their own
# diagnostic sensors, since this file does NOT define any of the entities that
# typically collide on duplicate name validation.
#
# Pair with:
#   - common/diagnostics.yaml   : status/uptime/wifi-signal/etc. sensors
#   - addon/provisioning.yaml   : AP fallback + captive portal
#
# REQUIRED SUBSTITUTIONS:
#   - device_name        : ESPHome device name
#   - friendly_name      : Human-readable device name
#   - device_description : Short device description
#
# REQUIRED SECRETS:
#   - wifi_ssid, wifi_password, wifi_domain
#   - api_encryption_key
#   - ota_password
#==============================================================================

esphome:
  name: ${device_name}
  comment: ${device_description}
  friendly_name: ${friendly_name}
  compile_process_limit: 1

logger:
  level: DEBUG

ota:
  platform: esphome
  password: !secret ota_password

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

web_server:
  port: 80
  version: 2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  min_auth_mode: WPA2

mdns:
  disabled: false

time:
  - platform: homeassistant
    id: device_time
