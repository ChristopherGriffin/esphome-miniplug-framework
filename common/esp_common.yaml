#==============================================================================
# ESPHome Base Package (Backward-Compatibility Shim)
#==============================================================================
# File: common/esp_common.yaml
#
# DEPRECATED: This file now exists only for backward compatibility. New device
# configs should include the three modular packages directly:
#
#   packages:
#     connectivity: !include esphome-framework/common/connectivity.yaml
#     diagnostics:  !include esphome-framework/common/diagnostics.yaml
#     provisioning: !include esphome-framework/addon/provisioning.yaml
#
# Devices that mix in third-party packages (e.g. esphome-econet) which bring
# their own diagnostic sensors should OMIT diagnostics to avoid duplicate
# entity errors.
#
# REQUIRED SUBSTITUTIONS / SECRETS: see connectivity.yaml and provisioning.yaml.
#==============================================================================

packages:
  connectivity: !include connectivity.yaml
  diagnostics:  !include diagnostics.yaml
  provisioning: !include ../addon/provisioning.yaml
