#==============================================================================
# Sonoff S31 - Hardware Package
#==============================================================================
# File: hardware/sonoff_s31.yaml
#
# Hardware-specific configuration for Sonoff S31 (ESP8266).
# Defines board, pins, power monitoring, and raw outputs.
# Combine with a function package (lamp, heater, timed_light, appliance, etc.).
#
# DEPENDENCIES:
#   - common/esp_common.yaml (provides connectivity, sensors, device_time)
#
# REQUIRED SUBSTITUTIONS:
#   - device_name        : ESPHome device name (lowercase, dashes ok)
#   - friendly_name      : Human-readable device name
#   - device_description : Device description/comment
#
# PROVIDES:
#   IDs:
#     - relay_output      : GPIO output for relay
#     - relay_led         : Dummy light for function package compatibility
#     - power             : Power sensor (W)
#     - current           : Current sensor (A)
#     - voltage           : Voltage sensor (V)
#     - energy            : Energy sensor (kWh)
#
# REQUIRES FROM FUNCTION PACKAGE:
#   - on_button_press     : Script called when button is briefly pressed
#   - on_button_hold      : Script called when button is held for 3+ seconds
#
# HARDWARE PINOUT (S31):
#   - GPIO0  : Button (inverted, pullup)
#   - GPIO12 : Relay (Red LED is hardware-coupled to relay)
#   - GPIO13 : Green LED (inverted) - Connection Status Indicator
#   - RX     : CSE7766 UART
#
# LED BEHAVIOR:
#   Red LED (Relay Status):
#     - Hardware-coupled to relay (not software controllable)
#     - ON when relay is ON, OFF when relay is OFF
#
#   Green LED (Connection Status):
#     - Fast blink (0.5s): WiFi disconnected
#     - Solid ON: WiFi connected, API disconnected
#     - Slow glow (2s): WiFi connected, API connected
#
# ENTITIES EXPOSED TO HOME ASSISTANT:
#   Sensors:
#     - Power          : Real-time power (W)
#     - Current        : Current draw (A)
#     - Voltage        : Line voltage (V)
#     - Energy         : Lifetime energy (kWh) — integral of filtered power.
#                        For daily/weekly/monthly views, configure HA's
#                        utility_meter on this sensor (cycle: daily, etc).
#     - Power Factor   : Power factor
#   Buttons:
#     - Reset Total Energy : Zeroes the displayed Energy (offset capture).
#
# USAGE:
#   substitutions:
#     device_name: "my-lamp"
#     friendly_name: "My Lamp"
#     device_description: "Living room lamp on Sonoff S31"
#
#   packages:
#     base: !include common/esp_common.yaml
#     hardware: !include hardware/sonoff_s31.yaml
#     function: !include functions/miniplug_lamp.yaml
#==============================================================================

substitutions:
  # Hardware pins - S31 specific
  pin_button: GPIO0
  pin_relay: GPIO12
  pin_led_green: GPIO13

  # Update intervals - can be overridden in device config
  # For heater monitoring, faster updates recommended (5s default)
  # For lamp/appliance monitoring, can increase to 30s or 60s to reduce traffic
  power_update_interval: "5s"

  # Power deadband (W) — readings below this clamp to 0. The CSE7766 produces
  # unreliable values below ~3W (especially for non-resistive loads like LED
  # bulbs), and those spurious bursts integrate into bogus daily-energy totals.
  # Override per-device if the load legitimately draws sub-1W power.
  power_deadband: "1.0"

#------------------------------------------------------------------------------
# ESP8266 Board Configuration
#------------------------------------------------------------------------------
esp8266:
  board: esp12e
  early_pin_init: false
  restore_from_flash: true  # persist restore_value entities (selects, numbers, datetimes, switches) across power cuts and reflashes; without this they live in RTC memory and are lost

esphome:
  name: ${device_name}
  comment: ${device_description}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: update_status_led

#------------------------------------------------------------------------------
# Connectivity Callbacks
# Note: logger baud_rate: 0 required - UART is used for power monitoring
#------------------------------------------------------------------------------
logger:
  baud_rate: 0
  logs:
    sensor: DEBUG
    light: INFO    # Silence DEBUG spam from status LED glow effect
    cse7766: WARN  # Silence power factor debug spam

api:
  on_client_connected:
    - script.execute: update_status_led
  on_client_disconnected:
    - script.execute: update_status_led

wifi:
  on_connect:
    - script.execute: update_status_led
  on_disconnect:
    - script.execute: update_status_led

#------------------------------------------------------------------------------
# UART for power monitoring chip (CSE7766)
#------------------------------------------------------------------------------
uart:
  rx_pin: RX
  baud_rate: 4800
  parity: EVEN

#------------------------------------------------------------------------------
# Hardware Outputs
#------------------------------------------------------------------------------
output:
  # Relay output (Red LED is hardware-coupled, not controllable separately)
  - platform: gpio
    id: relay_output
    pin: ${pin_relay}

  # Green LED - Connection Status (PWM for glow effect)
  - platform: esp8266_pwm
    id: status_led_output
    pin:
      number: ${pin_led_green}
      inverted: true
    frequency: 1000Hz

  # Dummy output for relay_led compatibility with function packages
  # On S31, the red relay LED is hardware-coupled and not software controllable
  - platform: template
    id: relay_led_output
    type: binary
    write_action:
      - logger.log:
          level: DEBUG
          format: "Relay LED state: %d (S31 LED is hardware-coupled)"
          args: ['state']

#------------------------------------------------------------------------------
# Connection Status LED (Green) - Managed by status script
#------------------------------------------------------------------------------
light:
  - platform: monochromatic
    id: status_led
    output: status_led_output
    internal: true
    default_transition_length: 0ms
    effects:
      # Fast blink for WiFi disconnected
      - strobe:
          name: "Fast Blink"
          colors:
            - state: true
              brightness: 100%
              duration: 500ms
            - state: false
              duration: 500ms
      # Slow glow for fully connected
      - lambda:
          name: "Slow Glow"
          update_interval: 40ms
          lambda: |-
            static float phase = 0;
            phase += 0.05;  // ~2s full cycle (50 steps * 40ms * 2)
            if (phase > 3.14159) phase = -3.14159;
            float brightness = (sin(phase) + 1.0) / 2.0;  // 0.0 to 1.0
            auto call = id(status_led).turn_on();
            call.set_brightness(brightness);
            call.set_transition_length(0);
            call.perform();

  # Dummy relay_led for function package compatibility
  # On S31, the red relay LED is hardware-coupled (not software controllable)
  # This allows function packages to call relay_led.turn_on/off without error
  - platform: binary
    id: relay_led
    output: relay_led_output
    internal: true

#------------------------------------------------------------------------------
# Status LED Control Script
#------------------------------------------------------------------------------
script:
  - id: update_status_led
    then:
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - light.turn_on:
                id: status_led
                brightness: 100%
                effect: "Fast Blink"
          else:
            - if:
                condition:
                  api.connected:
                then:
                  - light.turn_on:
                      id: status_led
                      brightness: 100%
                      effect: "Slow Glow"
                else:
                  - light.turn_on:
                      id: status_led
                      brightness: 100%
                      effect: none

#------------------------------------------------------------------------------
# Physical Button (GPIO0)
#------------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: physical_button
    internal: true
    pin:
      number: ${pin_button}
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_multi_click:
      # Short press: tap and release within 2.9s - fires on release
      - timing:
          - ON for at most 2.9s
          - OFF for at least 0.1s
        then:
          - script.execute: on_button_press
      # Long press: fires at 3s mark while still held - LED flashes to signal OK to release
      # Release after the 3s mark is ignored (no OFF condition)
      - timing:
          - ON for at least 3s
        then:
          - script.execute: on_button_hold

#------------------------------------------------------------------------------
# Periodic Status Check (backup for missed events)
#------------------------------------------------------------------------------
interval:
  - interval: 30s
    then:
      - script.execute: update_status_led

#------------------------------------------------------------------------------
# Energy Reset State
# Per-boot offset used by the "Reset Total Energy" button to zero the displayed
# Energy. Not flash-persisted on purpose: the CSE7766's lifetime counter resets
# to 0 on every boot, so persisting the offset across reboots would yield
# negative readings until the chip catches back up to the old offset value.
#------------------------------------------------------------------------------
globals:
  - id: energy_offset
    type: float
    restore_value: no
    initial_value: '0.0'

#------------------------------------------------------------------------------
# Power Monitoring (CSE7766)
#------------------------------------------------------------------------------
sensor:
  - platform: cse7766
    current:
      name: "Current"
      id: current
      unit_of_measurement: A
      accuracy_decimals: 2
      state_class: measurement
      device_class: current
      filters:
        - throttle_average: ${power_update_interval}
    voltage:
      name: "Voltage"
      id: voltage
      unit_of_measurement: V
      accuracy_decimals: 2
      state_class: measurement
      device_class: voltage
      filters:
        - throttle_average: ${power_update_interval}
    power:
      name: "Power"
      id: power
      unit_of_measurement: W
      accuracy_decimals: 2
      state_class: measurement
      device_class: power
      filters:
        - throttle_average: ${power_update_interval}
        # Deadband: clamp unreliable low-end readings to 0 so total_daily_energy
        # doesn't integrate phantom CSE7766 bursts at sub-threshold loads.
        - lambda: 'return x < ${power_deadband} ? 0.0f : x;'
    # Note: cse7766's energy block intentionally omitted. The chip accumulates
    # energy from raw pulse output BEFORE our power deadband filter runs, so
    # at low loads (LED bulbs, idle electronics) phantom pulses bloat the total
    # to nonsense values (e.g. 0.05 kWh after 12s with 1.6W actual draw). We
    # compute lifetime energy from the filtered power sensor below instead.
    power_factor:
      name: "Power Factor"
      accuracy_decimals: 2
      state_class: measurement
      device_class: power_factor
      filters:
        - throttle_average: ${power_update_interval}

  # Lifetime energy = integral of deadband-filtered power. Internal source
  # for the displayed Energy sensor below; not exposed to HA directly so the
  # offset-based reset can subtract from a clean baseline.
  - platform: integration
    id: energy_raw
    sensor: power
    time_unit: h
    internal: true
    restore: false
    filters:
      - multiply: 0.001  # W·h -> kWh

  # Lifetime Energy with reset support. Subtracts the offset that the
  # Reset Total Energy button captures, so we can zero the display without
  # touching the integration accumulator.
  - platform: template
    name: "Energy"
    id: energy
    unit_of_measurement: kWh
    accuracy_decimals: 3
    state_class: total_increasing
    device_class: energy
    update_interval: ${power_update_interval}
    lambda: 'return id(energy_raw).state - id(energy_offset);'

#------------------------------------------------------------------------------
# Energy Reset Button
# Captures the chip's current raw value as the new offset, so the displayed
# Energy sensor immediately reads 0 and accumulates from there. Survives until
# the next reboot (after which the chip is at 0 anyway).
#------------------------------------------------------------------------------
button:
  - platform: template
    name: "Reset Total Energy"
    icon: mdi:restart
    entity_category: config
    on_press:
      - lambda: |-
          id(energy_offset) = id(energy_raw).state;
          id(energy).publish_state(0.0f);
          ESP_LOGI("energy_reset", "Energy counter reset (offset=%.3f kWh)", id(energy_offset));
